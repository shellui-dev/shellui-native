name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies (src + tests)
      run: |
        dotnet restore src/ShellUI.Native.CLI/ShellUI.Native.CLI.csproj
        dotnet restore tests/ShellUI.Native.Tests/ShellUI.Native.Tests.csproj

    - name: Build library projects
      run: dotnet build src/ShellUI.Native.CLI/ShellUI.Native.CLI.csproj --no-restore --configuration Release

    - name: Run tests
      run: dotnet test tests/ShellUI.Native.Tests/ShellUI.Native.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: |
          tests/**/TestResults/**

    - name: Pack CLI tool
      run: dotnet pack src/ShellUI.Native.CLI/ShellUI.Native.CLI.csproj --no-restore --configuration Release -o ./nupkg

    - name: Upload CLI package
      uses: actions/upload-artifact@v7
      with:
        name: shellui-native-cli
        path: ./nupkg/*.nupkg

  # Separate job for MAUI examples (requires workloads)
  build-examples:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Install MAUI workload
      run: dotnet workload install maui

    - name: Restore examples
      run: dotnet restore examples/MAUI.Demo/MAUI.Demo.csproj

    - name: Build MAUI Demo (Windows)
      run: dotnet build examples/MAUI.Demo/MAUI.Demo.csproj --configuration Release --framework net10.0-windows10.0.19041.0

  # Avalonia is the cross-desktop target, so its demo builds on all three desktop OSes
  build-avalonia:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Build Avalonia Demo
      run: dotnet build examples/Avalonia.Demo/AvaloniaDemo.csproj --configuration Release

    # Renders every component and drives them with mouse and keyboard, headless (no display needed)
    - name: Run Avalonia headless tests
      run: dotnet test tests/ShellUI.Native.Avalonia.Tests/ShellUI.Native.Avalonia.Tests.csproj --configuration Release
